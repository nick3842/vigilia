# Vigilia — transparent status bar
# Open typography, restrained dividers, no opaque blocks over the artwork.
set -g status-position bottom
set -g status-justify left
set -g status-interval 15
set -g status-style 'fg=#C4CED8,bg=default'
set -g status-left-length 40
set -g status-right-length 60
set -g status-left-style none
set -g status-right-style none
set -g status-left '  #[fg=#F1EEE6,bold]#{s/_+$//:session_name}#[nobold]#{?client_prefix,#[fg=#F0A0B5]  ⌘,}#[fg=#344657]   │   '
set -g status-right '#{?#{e|>=:#{client_width},110},#[fg=#70CEE0]#{=28:#{b:pane_current_path}}#[fg=#344657]   │   ,}#{?#{e|>=:#{client_width},80},#[fg=#C4CED8]%H:%M  ,}'
setw -g window-status-style 'fg=#C4CED8,bg=default'
setw -g window-status-format '#[fg=#99A9B6]#I  #[fg=#C4CED8]#W#{?window_bell_flag,#[fg=#F0A0B5] !,#{?window_activity_flag,#[fg=#70CEE0] ·,}}'
setw -g window-status-current-style 'fg=#F2CC70,bg=default,bold'
setw -g window-status-current-format '#[fg=#F2CC70,bold]● #I  #W#[nobold]'
setw -g window-status-separator '#[bg=default,nobold]    '
setw -g window-status-activity-style 'fg=#70CEE0,bg=default'
setw -g window-status-bell-style 'fg=#F0A0B5,bg=default'
setw -g window-status-last-style default
setw -g pane-border-style 'fg=#344657'
setw -g pane-active-border-style 'fg=#F2CC70'
set -g message-style 'fg=#F1EEE6,bg=#172333'
set -g message-command-style 'fg=#151E2C,bg=#F2CC70'
setw -g mode-style 'fg=#151E2C,bg=#70CEE0'
setw -g clock-mode-colour '#70CEE0'
